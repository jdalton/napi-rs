<text x="691" y="282" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="start">MB</text>
<text x="36" y="187" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">raw</text>
<rect x="205" y="172" width="454.4" height="22" rx="3" fill="#484f58" fill-opacity="1"/>
<text x="667.4" y="187" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start">8.52</text>
<text x="36" y="219" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Rust build opt-level=z</text>
<rect x="205" y="204" width="183.46666666666667" height="22" rx="3" fill="#d29922" fill-opacity="1"/>
<text x="396.4666666666667" y="219" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start">3.44</text>
<text x="36" y="251" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">--compress</text>
<rect x="205" y="236" width="135.46666666666667" height="22" rx="3" fill="#3fb950" fill-opacity="1"/>
<text x="348.4666666666667" y="251" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start">2.54</text>
<text x="36" y="330" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">Minify throughput</text>
<text x="178.8" y="330" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">— ops/sec, higher is better</text>
<line x1="205" y1="344" x2="205" y2="446" stroke="#21262d"/><text x="205" y="462" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="middle">0</text><line x1="352.69230769230774" y1="344" x2="352.69230769230774" y2="446" stroke="#21262d"/><text x="352.69230769230774" y="462" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="middle">20</text><line x1="500.3846153846154" y1="344" x2="500.3846153846154" y2="446" stroke="#21262d"/><text x="500.3846153846154" y="462" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="middle">40</text><line x1="648.0769230769231" y1="344" x2="648.0769230769231" y2="446" stroke="#21262d"/><text x="648.0769230769231" y="462" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="middle">60</text>
