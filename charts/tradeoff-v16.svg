<text x="36" y="367" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">raw</text>
<rect x="205" y="352" width="443.0769230769231" height="22" rx="3" fill="#484f58" fill-opacity="1"/>
<text x="656.0769230769231" y="367" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start">~60</text>
<text x="36" y="399" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">Rust build opt-level=z</text>
<rect x="205" y="384" width="140.30769230769232" height="22" rx="3" fill="#d29922" fill-opacity="1"/>
<text x="353.3076923076923" y="399" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start">~19 · ~3× slower</text>
<text x="36" y="431" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">--compress</text>
<rect x="205" y="416" width="443.0769230769231" height="22" rx="3" fill="#3fb950" fill-opacity="1"/>
<text x="656.0769230769231" y="431" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="normal" fill="#8b949e" text-anchor="start">~60 · same as raw</text>
<line x1="36" y1="482" x2="724" y2="482" stroke="#21262d"/>
<text x="36" y="502" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="bold" fill="#e6edf3" text-anchor="start">The takeaway</text>
<text x="36" y="522" font-size="11" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">The native file is already optimized about as much as the usual build flags allow, so there isn’t much size</tspan></text>
<text x="36" y="538" font-size="11" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">left to remove at compile time. You can push harder with the </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" fill="#79c0ff">opt-level=z</tspan><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e"> build setting — it makes the</tspan></text>
<text x="36" y="554" font-size="11" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">file smaller, but it also makes the library run noticeably slower (about 3× here). </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" fill="#79c0ff">--compress</tspan><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e"> gives you a</tspan></text>
<text x="36" y="570" font-size="11" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">smaller file and the exact same runtime speed, because the code that runs is byte-for-byte identical — just</tspan></text>
<text x="36" y="586" font-size="11" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">stored compressed and unpacked once. (ops/sec depends on the machine, but the ratio between them holds.)</tspan></text>
</svg>