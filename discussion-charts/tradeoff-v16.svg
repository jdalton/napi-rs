<line x1="36" y1="482" x2="724" y2="482" stroke="#21262d"/>
<text x="36" y="500" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="10.5" font-weight="normal" fill="#6e7681" text-anchor="start">Already stripped + fat LTO, so the only Rust knob left is opt-level=z — smaller, but it makes the minifier</text>
