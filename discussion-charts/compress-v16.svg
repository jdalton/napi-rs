<text x="409.7647058823529" y="451" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="start">~150 ms</text>
<text x="30" y="466" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#8b949e" text-anchor="start">decmpfs .node</text>
<rect x="190" y="459" width="211.76470588235296" height="8" rx="3" fill="#484f58" fill-opacity="0.45"/>
<rect x="401.7647058823529" y="459" width="14.11764705882353" height="8" rx="3" fill="#d29922" fill-opacity="0.45"/>
<text x="423.88235294117646" y="466" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9.5" font-weight="normal" fill="#6e7681" text-anchor="start">~160 ms · +10 ms</text>
<line x1="30" y1="484" x2="610" y2="484" stroke="#21262d"/>
<text x="30" y="502" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="start">Steady state adds 0.3 ms over raw: a 24-byte footer read, one stat, and the stub’s own dlopen — no decode when warm.</text>
<text x="30" y="516" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="start">First load pays a one-time OS cost to validate + map a freshly-written native module (.dylib / .so / .dll), cached</text>
<text x="30" y="530" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="start">per file — so every later load, even from another process, is the fast ~1.5 ms (not per-process). Same shape on every</text>
<text x="30" y="544" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="start">OS; the ~150 ms is macOS code-signing, smaller elsewhere. A raw addon pays it once too; decmpfs adds ~10 ms.</text>
</svg>