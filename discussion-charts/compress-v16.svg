<text x="30" y="390" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">raw *.node</text>
<rect x="190" y="382" width="81.4" height="9" rx="3" fill="#484f58" fill-opacity="1"/>
<text x="279.4" y="390" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="10.5" font-weight="normal" fill="#8b949e" text-anchor="start">1.48 ms · baseline</text>
<text x="30" y="406" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">decmpfs</text>
<rect x="190" y="398" width="81.4" height="9" rx="3" fill="#3fb950" fill-opacity="1"/>
<text x="279.4" y="406" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="10.5" font-weight="normal" fill="#8b949e" text-anchor="start">1.48 ms · native, overwritten stub</text>
<text x="30" y="422" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="normal" fill="#e6edf3" text-anchor="start">fallback tmpdir</text>
<rect x="190" y="414" width="99" height="9" rx="3" fill="#3fb950" fill-opacity="1"/>
<text x="297" y="422" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="10.5" font-weight="normal" fill="#8b949e" text-anchor="start">1.80 ms +0.3 ms</text>
<text x="30" y="436" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="9" font-weight="normal" fill="#6e7681" text-anchor="start">+0.3 ms = per-load stub overhead — a footer read, one stat, the stub’s own dlopen; not decode + cache write (first-load only).</text>
<line x1="30" y1="450" x2="610" y2="450" stroke="#21262d"/>
<text x="30" y="470" font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="bold" fill="#e6edf3" text-anchor="start">How it loads — and where</text>
<text x="30" y="488" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">With the </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" fill="#79c0ff">--compress</tspan><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e"> flag, each generated </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" fill="#79c0ff">*.node</tspan><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e"> is a small self-loading file. On a filesystem with</tspan></text>
<text x="30" y="502" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">built-in compression it rewrites itself compressed on first load and then loads at native speed, never unpacked</tspan></text>
<text x="30" y="516" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">again. Those are APFS (the default on every modern Mac) and NTFS (the default on every Windows PC), so all macOS</tspan></text>
<text x="30" y="530" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">and Windows machines qualify — including GitHub Actions runners and most cloud Windows/macOS instances. On Linux</tspan></text>
<text x="30" y="544" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">it is btrfs (default on Fedora and openSUSE); but most Linux servers and CI — GitHub Actions Ubuntu, the usual</tspan></text>
<text x="30" y="558" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">AWS / Azure / GCP images — run ext4 or xfs, which do not compress, so there it falls back to an ephemeral system</tspan></text>
<text x="30" y="572" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">cache (the OS temp dir, cleared on reboot; plus the +0.3 ms above). On a compressing filesystem the first load is the same</tspan></text>
<text x="30" y="586" font-size="9.5" xml:space="preserve"><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e">or faster than the raw </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" fill="#79c0ff">.node</tspan><tspan font-family="-apple-system, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" fill="#8b949e"> — the kernel reads fewer bytes — so no load penalty; only the ext4/xfs fallback decodes once.</tspan></text>
</svg>